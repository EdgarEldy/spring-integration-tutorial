name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      # Fast and cheap: a broken docker-compose.yml (syntax, interpolation) fails the build in seconds,
      # without building any image.
      - name: Validate docker-compose.yml
        run: docker compose config -q

      # Full build. No "services: postgres" block: the integration tests start their own postgres:16
      # container through Testcontainers, using the Docker daemon already available on ubuntu-latest.
      - name: Build and test
        run: ./mvnw -B verify
